[package]
name = "grimoire-tui"
version = "0.1.0"
edition = "2024"
description = "A terminal writing desk for novels"
authors = ["Josh King"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/kelsierbot/GrimoireTUI"
homepage = "https://grimoire.joshking.ai"
keywords = ["tui", "writing", "novel", "markdown", "editor"]
categories = ["command-line-utilities", "text-editors"]

# The published crate is `grimoire-tui`; the command you type is `grimoire`.
[[bin]]
name = "grimoire"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
# Same cpal that rodio already pulls in; used directly for loopback capture.
cpal = { version = "0.17", optional = true }
ratatui = "0.30.2"
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-vorbis", "symphonia-wav"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
unicode-width = "0.2.2"
ureq = { version = "3.4.1", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[features]
# Audio playback for the Jellyfin and Plex sources, and system-audio capture
# for the spectrum view (macOS 14.6+). Default on; on Linux it needs ALSA
# headers (libasound2-dev). Build with --no-default-features to omit it and
# keep the other sources.
default = ["audio"]
audio = ["dep:rodio", "dep:cpal"]
