[package]
name = "grimoire-mobile"
version = "0.3.4"
edition = "2024"
description = "Grimoire on Android: a phone-shaped front end over grimoire-core"
authors = ["Josh King"]
license = "MIT"
repository = "https://github.com/kelsierbot/GrimoireTUI"

# Its own workspace: the terminal app's `cargo build` and `cargo test` should
# never have to drag in Tauri (or a desktop webview) to check a word count.
[workspace]

[lib]
# Android loads the app through a shared library; the desktop binary calls the
# same run() from main.rs.
name = "grimoire_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
grimoire-app = { path = "../../../crates/grimoire-app", version = "0.3.4" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2", features = [] }

# Android only: asking the system for permission to reach a folder the writer
# actually shares with their other apps means talking to Java. Nothing else in
# this crate needs it, and nothing in grimoire-app does.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
