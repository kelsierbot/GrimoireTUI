name: installer-check

# After a release is published, install it exactly the way the README tells
# people to — the one-line installer — and run what got installed from a new
# terminal.
#
# GitHub's runners come with Rust, so ~/.cargo/bin is already on their PATH and
# CARGO_HOME is set. A real user has neither. Each job strips both first, so a
# pass means the installer really put grimoire on PATH, not that the image did.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

jobs:
  windows:
    # Tag pushes only: the Release workflow also runs a plan-only pass on PRs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm has no ARM build to fetch; the installer should fall
        # back to x64, which Windows runs under emulation.
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Look like a PC that has never had Rust
        shell: powershell
        run: |
          $strip = { param($p) (($p -split ';') | Where-Object { $_ -and $_ -notmatch '\\\.cargo\\bin' }) -join ';' }
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          [Environment]::SetEnvironmentVariable('Path', (& $strip $user), 'User')
          [Environment]::SetEnvironmentVariable('CARGO_HOME', $null, 'User')
          $machine = [Environment]::GetEnvironmentVariable('Path', 'Machine')
          if ($machine -match '\\\.cargo\\bin') { [Environment]::SetEnvironmentVariable('Path', (& $strip $machine), 'Machine') }
          [Environment]::SetEnvironmentVariable('CARGO_HOME', $null, 'Machine')
          if (Test-Path "$HOME\.cargo\bin\grimoire.exe") { throw 'grimoire is already installed' }

      - name: Install with the one-liner, from Command Prompt as the README allows
        shell: cmd
        run: |
          set CARGO_HOME=
          set "PATH=C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          powershell -ExecutionPolicy Bypass -c "irm https://github.com/kelsierbot/GrimoireTUI/releases/latest/download/grimoire-tui-installer.ps1 | iex" > install.log 2>&1
          type install.log

      - name: An x64 grimoire.exe was installed (Windows on ARM runs it emulated)
        shell: powershell
        run: |
          # The installer names the machine's own triple (aarch64-… on ARM) but
          # maps it to the x64 download, so check the program, not the log.
          $bytes = [IO.File]::ReadAllBytes("$HOME\.cargo\bin\grimoire.exe")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          Write-Host ("installed grimoire.exe machine type: 0x{0:X4}" -f $machine)
          if ($machine -ne 0x8664) { throw 'grimoire.exe is not an x64 build' }

      - name: grimoire runs from a new terminal
        shell: powershell
        run: |
          # A new terminal builds PATH from the registry — which is only where
          # the installer could have put it, now that the step above cleared it.
          $user = [Environment]::GetEnvironmentVariable('Path', 'User')
          if ($user -notmatch '\\\.cargo\\bin') { throw "the installer did not add .cargo\bin to the user PATH: $user" }
          $env:Path = $user + ';' + [Environment]::GetEnvironmentVariable('Path', 'Machine')
          $cmd = Get-Command grimoire -ErrorAction Stop
          Write-Host "grimoire resolves to $($cmd.Source)"
          grimoire --help
          if ($LASTEXITCODE -ne 0) { throw "grimoire --help exited $LASTEXITCODE" }
          $book = Join-Path $env:RUNNER_TEMP 'book'
          grimoire new $book
          if (-not (Test-Path (Join-Path $book 'manuscript'))) { throw "no manuscript in $book" }

  unix:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    strategy:
      fail-fast: false
      matrix:
        include:
          # How each system's own terminal starts a shell: Terminal.app runs a
          # login zsh; a Linux terminal runs a non-login interactive bash.
          - { os: macos-latest, new-terminal: zsh -ilc }     # Apple Silicon
          - { os: macos-15-intel, new-terminal: zsh -ilc }   # Intel Mac
          - { os: ubuntu-latest, new-terminal: bash -ic }    # x86_64 Linux
          - { os: ubuntu-24.04-arm, new-terminal: bash -ic } # ARM64 Linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install with the one-liner into a brand-new home folder
        run: |
          home="$RUNNER_TEMP/fresh-home"
          mkdir -p "$home"
          # A new Linux account starts with /etc/skel's dotfiles; a new Mac
          # account starts with none.
          if [ -d /etc/skel ]; then cp -a /etc/skel/. "$home/"; fi
          shell="${{ matrix.new-terminal }}"; shell="/bin/${shell%% *}"
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin SHELL="$shell" \
            sh -c "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/kelsierbot/GrimoireTUI/releases/latest/download/grimoire-tui-installer.sh | sh"

      - name: grimoire runs from a new terminal
        run: |
          home="$RUNNER_TEMP/fresh-home"
          # A new terminal's shell with nothing on PATH but the system —
          # grimoire can only be found through the profile the installer edited.
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin TERM=xterm \
            ${{ matrix.new-terminal }} '
              set -e
              echo "grimoire resolves to $(command -v grimoire)"
              grimoire --help
              grimoire new "$HOME/book"
              test -d "$HOME/book/manuscript"
            '

      - name: What the installer left behind (on failure)
        if: failure()
        run: |
          home="$RUNNER_TEMP/fresh-home"
          ls -la "$home" "$home/.cargo" || true
          for f in .profile .bashrc .bash_profile .bash_login .zshrc .zshenv; do
            [ -f "$home/$f" ] && { echo "== $f (last 5 lines)"; tail -5 "$home/$f"; }
          done
          echo "== .cargo/env"; cat "$home/.cargo/env" || true
          echo "== /etc/skel"; ls -la /etc/skel || true
          echo "== trace of the new terminal's startup"
          env -i HOME="$home" PATH=/usr/bin:/bin:/usr/sbin:/sbin TERM=xterm \
            ${{ matrix.new-terminal }} -x 'echo PATH=$PATH' 2>&1 | grep -v "^+++* *\(\[\|case\|shopt\|HIST\|alias\|if\|test\|\]\)" | tail -40 || true
