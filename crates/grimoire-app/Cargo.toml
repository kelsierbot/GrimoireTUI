[package]
name = "grimoire-app"
version.workspace = true
edition = "2024"
description = "Front-end-facing services over grimoire-core: shelf, outline, scene, guarded save"
authors = ["Josh King"]
license = "MIT"
repository = "https://github.com/kelsierbot/GrimoireTUI"

[dependencies]
grimoire-core = { path = "../grimoire-core", version = "0.4" }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.43", default-features = false, features = ["clock"] }
